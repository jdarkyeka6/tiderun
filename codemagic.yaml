workflows:
  ios-testflight:
    name: Tiderun → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: tiderun-apple

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tidegames.tiderun
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: 26.6
      cocoapods: default

    scripts:
      - name: Install JavaScript dependencies
        script: npm install

      - name: Build Tiderun web game
        script: npm run build

      - name: Generate native iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install iOS dependencies
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install
          fi

      - name: Set app version and build number
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$PBXPROJ"
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 0.1.0;/g" "$PBXPROJ"

      - name: Apply App Store signing
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
