<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030714">
<title>Aether Particle Lab</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f2f7ff;background:#030714}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit}button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #64e3ff;outline-offset:2px}
#space{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#030714}
.ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 25%,rgba(0,2,12,.43) 100%)}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 13px) 17px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#030714c9,transparent);pointer-events:none}
.brand,.tools{display:flex;align-items:center;gap:10px;pointer-events:auto}
.logo{height:43px;width:43px;display:grid;place-items:center;border:1px solid #7d92ee66;border-radius:14px;background:linear-gradient(135deg,#5044a85c,#1c9aa83c);font-size:28px;color:#9cefff}
.name{font-size:17px;letter-spacing:.16em;font-weight:850;line-height:1.1}
.sub{font-size:9px;letter-spacing:.25em;color:#9bb0cf;font-weight:800;margin-top:6px}
.circle{height:39px;width:39px;display:grid;place-items:center;border:1px solid #9aa9d633;border-radius:13px;background:#0b1329b5;font-size:20px;backdrop-filter:blur(12px)}
.status{position:fixed;top:calc(env(safe-area-inset-top) + 76px);left:20px;font-size:10px;color:#b1c1db;font-weight:750;letter-spacing:.12em;display:flex;align-items:center;gap:9px;pointer-events:none}
.live{height:6px;width:6px;border-radius:50%;background:#45e6b6;box-shadow:0 0 10px #4ce8b3}
#hint{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;font-size:13px;line-height:1.9;letter-spacing:.06em;color:#e2eafaad;pointer-events:none;text-shadow:0 0 20px #000;transition:opacity .5s}#hint.hidden{opacity:0}#hint b{font-size:25px}
.dock{position:fixed;bottom:0;left:0;right:0;padding:0 11px calc(env(safe-area-inset-bottom) + 11px);pointer-events:none}
.panel{max-width:650px;margin:auto;border:1px solid #9baff23a;border-radius:25px;background:linear-gradient(145deg,#182340df,#080e22ec);backdrop-filter:blur(23px);-webkit-backdrop-filter:blur(23px);box-shadow:0 18px 65px #000a;overflow:hidden;pointer-events:auto}
.heading{display:flex;justify-content:space-between;padding:14px 15px 5px}
.cap{font-size:10px;letter-spacing:.16em;font-weight:850;color:#9cafd0}
.presets{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:8px 12px 12px;touch-action:pan-x}.presets::-webkit-scrollbar{display:none}
.scene{flex-shrink:0;padding:11px;border:1px solid #a1b4e72b;border-radius:12px;background:#ffffff0a;color:#bfcbe2;font-size:12px;font-weight:750}
.scene.active{color:#fff;border-color:#8297f4a8;background:linear-gradient(125deg,#7065df4d,#49afc33b)}
.modehead{display:flex;justify-content:space-between;margin-bottom:10px}
.modes{padding:12px;border-top:1px solid #99afea22}
.modegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mode{padding:9px 3px;border:1px solid #9db0df29;border-radius:12px;background:#ffffff09;font-size:11px;font-weight:750;color:#becee8;display:flex;align-items:center;flex-direction:column;gap:4px}
.mode span{font-size:19px}.mode.active{background:#208eb642;border-color:#64d9edac;color:white}
.actions{display:flex;gap:8px;padding:11px 12px 12px;border-top:1px solid #99afea22}
.action{height:37px;padding:0 12px;border:1px solid #a4b7e62b;border-radius:12px;background:#ffffff0e;font-size:11px;font-weight:750;white-space:nowrap}
.action.major{flex:1;background:linear-gradient(120deg,#6668c993,#358fa690);border-color:#909ff77d}
.controls{display:none;padding:0 17px 15px;max-height:35vh;overflow-y:auto}.controls.open{display:block}
.setting{margin:12px 0}.pair{display:flex;justify-content:space-between;color:#c5d2e8;font-size:12px;font-weight:600;margin-bottom:8px}
.pair b{color:white;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#859aff}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#c5d2e8;margin-top:12px}.toggle input{accent-color:#819eff;width:18px;height:18px}
.foot{font-size:10px;color:#8397b8;text-align:center;margin:10px 0 2px}
@media(max-height:680px){.heading{padding-top:8px}.presets{padding-bottom:7px}.modes{padding-top:7px;padding-bottom:7px}.mode{padding:6px 2px}.actions{padding-top:7px;padding-bottom:7px}}
@media(min-width:700px){.dock{bottom:15px}}
</style>
</head>
<body>
<canvas id="space" aria-label="Interactive particles"></canvas><div class="ambient"></div>
<div class="top"><div class="brand"><div class="logo">✧</div><div><div class="name">AETHER</div><div class="sub">PARTICLE LAB</div></div></div><div class="tools"><button class="circle" id="shuffle" aria-label="Shuffle scene">⤨</button><button class="circle" id="pause" aria-label="Pause">Ⅱ</button></div></div>
<div class="status"><i class="live" id="live"></i><span id="state">LIVE SIMULATION</span> • <span id="count">1,200 PARTICLES</span></div>
<div id="hint"><b>✦</b><div>Touch the universe<br>and watch it respond</div></div>
<div class="dock"><section class="panel">
<div class="heading"><span class="cap">EXPLORE WORLDS</span><span class="cap" id="sceneNumber">01 / 06</span></div>
<div class="presets" id="presets" role="group" aria-label="Scenes"></div>
<div class="modes"><div class="modehead"><span class="cap">TOUCH PHYSICS</span><span class="cap" id="modeName">ATTRACT</span></div><div class="modegrid" id="modes" role="group" aria-label="Physics modes"></div></div>
<div class="actions"><button class="action major" id="burst">✦ Particle Burst</button><button class="action" id="reset">↺ Reset</button><button class="action" id="settingsButton" aria-expanded="false">☷ Controls</button></div>
<div class="controls" id="controls">
<div class="setting"><div class="pair"><span>Particle density</span><b id="densityValue">1,200</b></div><input type="range" id="density" min="300" max="2500" step="100" value="1200"></div>
<div class="setting"><div class="pair"><span>Touch force</span><b id="forceValue">65%</b></div><input type="range" id="force" min="10" max="100" step="5" value="65"></div>
<div class="setting"><div class="pair"><span>Light trails</span><b id="trailValue">75%</b></div><input type="range" id="trail" min="0" max="100" step="5" value="75"></div>
<div class="setting"><div class="pair"><span>Animation speed</span><b id="speedValue">1×</b></div><input type="range" id="speed" min="25" max="180" step="5" value="100"></div>
<label class="toggle"><span>Auto-demo while untouched</span><input type="checkbox" id="auto" checked></label>
<p class="foot">Multi-touch supported • Fully offline • No tracking</p>
</div></section></div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('space'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const $=id=>document.getElementById(id);
if(!ctx){$('hint').textContent='Canvas 2D is unavailable';return;}
const scenes=[
 {id:'nebula',name:'Nebula',icon:'✧',hues:[185,204,226,259,290]},
 {id:'galaxy',name:'Galaxy',icon:'◎',hues:[193,217,234,265,301]},
 {id:'rain',name:'Meteor Rain',icon:'☄',hues:[179,194,215,246,278]},
 {id:'sparks',name:'Sparks',icon:'✺',hues:[15,28,38,46,53]},
 {id:'fireflies',name:'Fireflies',icon:'❋',hues:[94,118,153,170,187]},
 {id:'aurora',name:'Aurora',icon:'≋',hues:[153,175,192,235,284]}
];
const modes=[{id:'attract',name:'Attract',icon:'↘'},{id:'repel',name:'Repel',icon:'↗'},{id:'vortex',name:'Vortex',icon:'◉'},{id:'blast',name:'Blast',icon:'✺'}];
const defaults={scene:'nebula',mode:'attract',density:1200,force:65,trail:75,speed:100,auto:true};
let config={...defaults};
try{const old=JSON.parse(localStorage.getItem('aether-opts')||'{}');for(const k in defaults){if(typeof old[k]===typeof defaults[k])config[k]=old[k];}}catch(e){}
if(!scenes.some(s=>s.id===config.scene))config.scene='nebula';
if(!modes.some(m=>m.id===config.mode))config.mode='attract';
config.density=Math.max(300,Math.min(2500,Math.round(config.density/100)*100));
config.force=Math.max(10,Math.min(100,config.force));config.trail=Math.max(0,Math.min(100,config.trail));config.speed=Math.max(25,Math.min(180,config.speed));
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let w=1,h=1,scale=1,particles=[],sprites={},touches=new Map(),ripples=[],phase=0,last=0,paused=false,touched=false;
function persist(){try{localStorage.setItem('aether-opts',JSON.stringify(config));}catch(e){}}
function createSprites(){
 for(const s of scenes){sprites[s.id]=s.hues.map(hue=>{
   const c=document.createElement('canvas');c.width=c.height=48;const p=c.getContext('2d');
   const g=p.createRadialGradient(24,24,0,24,24,24);
   g.addColorStop(0,'hsla('+hue+',100%,95%,1)');
   g.addColorStop(.13,'hsla('+hue+',100%,77%,.92)');
   g.addColorStop(.30,'hsla('+hue+',100%,62%,.43)');
   g.addColorStop(.65,'hsla('+hue+',100%,48%,.09)');
   g.addColorStop(1,'hsla('+hue+',100%,45%,0)');
   p.fillStyle=g;p.fillRect(0,0,48,48);return c;});}
}
function newParticle(i){
 const cx=w/2,cy=h*.45,r=Math.min(w,h)*.42;
 const p={x:0,y:0,vx:0,vy:0,angle:rand(0,TAU),size:rand(.65,1.6),tone:i%5,age:rand(0,250),seed:rand(0,TAU)};
 const a=rand(0,TAU);
 if(config.scene==='nebula'){
   const d=Math.sqrt(Math.random())*r;
   p.x=cx+Math.cos(a)*d*1.25;p.y=cy+Math.sin(a)*d*.85;
   p.vx=-Math.sin(a)*rand(.08,.45);p.vy=Math.cos(a)*rand(.08,.45);
 }else if(config.scene==='galaxy'){
   const d=Math.pow(Math.random(),.6)*r*1.4+8,vel=clamp(1.5*Math.sqrt(125/(d+30)),.4,1.8);
   p.x=cx+Math.cos(a)*d;p.y=cy+Math.sin(a)*d*.70;
   p.vx=-Math.sin(a)*vel;p.vy=Math.cos(a)*vel*.70;
 }else if(config.scene==='rain'){
   p.x=rand(-w*.15,w*1.1);p.y=rand(-h,h);
   p.vx=rand(-.3,.2);p.vy=rand(1.4,4.5);
 }else if(config.scene==='sparks'){
   const vel=rand(.5,6);
   p.x=cx+rand(-22,22);p.y=cy+rand(-22,22);
   p.vx=Math.cos(a)*vel;p.vy=Math.sin(a)*vel;p.age=rand(0,200);
 }else if(config.scene==='fireflies'){
   p.x=rand(0,w);p.y=rand(0,h);p.vx=rand(-.3,.3);p.vy=rand(-.3,.3);
 }else{
   p.x=rand(0,w);p.y=rand(h*.14,h*.82);
   p.vx=rand(.15,.8);p.vy=rand(-.2,.2);
 }
 return p;
}
function counters(){
 $('count').textContent=particles.length.toLocaleString()+' PARTICLES';
 $('sceneNumber').textContent=String(scenes.findIndex(s=>s.id===config.scene)+1).padStart(2,'0')+' / 06';
 $('modeName').textContent=config.mode.toUpperCase();
 $('densityValue').textContent=config.density.toLocaleString();
 $('forceValue').textContent=config.force+'%';
 $('trailValue').textContent=config.trail+'%';
 $('speedValue').textContent=(config.speed/100).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'×';
}
function reset(){
 particles=Array.from({length:config.density},(_,i)=>newParticle(i));ripples=[];
 ctx.globalCompositeOperation='source-over';ctx.fillStyle='#030714';ctx.fillRect(0,0,w,h);counters();
}
function resize(){
 const ow=w,oh=h;w=window.innerWidth;h=window.innerHeight;scale=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
 ctx.setTransform(scale,0,0,scale,0,0);
 ctx.fillStyle='#030714';ctx.fillRect(0,0,w,h);
 if(particles.length&&ow>1&&oh>1){for(const p of particles){p.x=p.x/ow*w;p.y=p.y/oh*h;}}else reset();
}
function burst(x,y,n){
 for(let i=0;i<n;i++){
   const p=particles[Math.floor(Math.random()*particles.length)];if(!p)break;
   const a=rand(0,TAU),v=rand(2,9);p.x=x;p.y=y;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v;p.age=0;
 }
 ripples.push({x,y,age:0});
}
function frame(now){
 requestAnimationFrame(frame);
 if(!last)last=now;
 const elapsed=Math.min(40,now-last);last=now;
 if(paused)return;
 const dt=clamp(elapsed/16.67,0,2.4)*config.speed/100;
 phase+=dt*.016;
 const opacity=config.trail<5?1:clamp(.55-config.trail*.005,.05,.55);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.fillStyle='rgba(3,7,20,'+opacity+')';ctx.fillRect(0,0,w,h);
 const cx=w/2,cy=h*.45,scene=config.scene,mode=config.mode,force=config.force/65;
 const active=Array.from(touches.values());
 if(!touched&&config.auto&&active.length===0){active.push({x:cx+Math.cos(phase*.55)*w*.22,y:cy+Math.sin(phase*.67)*h*.17,demo:true});}
 ctx.globalCompositeOperation='lighter';
 const images=sprites[scene];
 for(let i=0;i<particles.length;i++){
   const p=particles[i];let ax=0,ay=0;
   if(scene==='nebula'){
     const dx=cx-p.x,dy=cy-p.y;
     ax+=(dx*.00018-dy*.000095)*dt;
     ay+=(dy*.00018+dx*.000095)*dt;
   }else if(scene==='galaxy'){
     const dx=cx-p.x,dy=(cy-p.y)/.7,d=Math.hypot(dx,dy)+16;
     const a=clamp(1.55/(d+40),.0015,.022);
     ax+=dx/d*a*42*dt;ay+=dy/d*a*27*dt;
   }else if(scene==='rain'){
     ay+=.037*dt;ax+=Math.sin(phase+p.seed)*.004*dt;
   }else if(scene==='sparks'){
     ay+=.025*dt;ax+=Math.sin(p.angle+phase)*.012*dt;
   }else if(scene==='fireflies'){
     ax+=Math.sin(phase*1.5+p.angle+p.age*.01)*.025*dt;
     ay+=Math.cos(phase+p.seed+p.age*.012)*.025*dt;
   }else{
     ax+=.005*dt;ay+=(Math.sin(p.x*.012+phase*2+p.angle)*.085+(cy-p.y)*.00015)*dt;
   }
   for(let j=0;j<active.length;j++){
     const q=active[j],dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
     const radius=Math.min(w,h)*.30+65;
     if(d2>=radius*radius||d2<1)continue;
     const d=Math.sqrt(d2),f=Math.pow(1-d/radius,2)*.98*force*dt;
     if(mode==='attract'){ax+=dx/d*f;ay+=dy/d*f;}
     else if(mode==='repel'){ax-=dx/d*f;ay-=dy/d*f;}
     else if(mode==='vortex'){ax+=(-dy/d*1.6+dx/d*.16)*f;ay+=(dx/d*1.6+dy/d*.16)*f;}
     else{ax-=dx/d*f*2.1;ay-=dy/d*f*2.1;}
   }
   p.vx=clamp((p.vx+ax)*.998,-11,11);p.vy=clamp((p.vy+ay)*.998,-11,11);
   p.x+=p.vx*dt;p.y+=p.vy*dt;p.age+=dt;
   const m=28;
   if(scene==='rain'&&(p.y>h+m||p.x>w+m||p.x<-m)){p.x=rand(0,w);p.y=-m;p.vy=rand(1.5,4);}
   else if(scene==='sparks'&&(p.age>350||p.x<-m||p.x>w+m||p.y>h+m)){Object.assign(p,newParticle(i));p.age=0;}
   else if(scene==='aurora'&&(p.x>w+m||p.y>h+70||p.y<-70)){p.x=-m;p.y=rand(h*.18,h*.75);}
   else if(scene!=='rain'&&scene!=='sparks'&&scene!=='aurora'){
     if(p.x<-m)p.x=w+m;if(p.x>w+m)p.x=-m;
     if(p.y<-m)p.y=h+m;if(p.y>h+m)p.y=-m;
   }
   const sz=(scene==='rain'?2.7:3.5)*p.size;
   ctx.globalAlpha=(.72+.23*Math.sin(phase*1.4+p.seed+p.age*.01));
   ctx.drawImage(images[p.tone],p.x-sz,p.y-sz,sz*2,sz*2);
 }
 ctx.globalCompositeOperation='screen';
 for(let i=ripples.length-1;i>=0;i--){
   const r=ripples[i];r.age+=dt;if(r.age>39){ripples.splice(i,1);continue;}
   ctx.beginPath();ctx.arc(r.x,r.y,r.age*6,0,TAU);
   ctx.strokeStyle='rgba(100,215,255,'+(.5*(1-r.age/39))+')';ctx.lineWidth=2;ctx.stroke();
 }
 for(const p of active){if(p.demo)continue;ctx.beginPath();ctx.arc(p.x,p.y,31+Math.sin(phase*2)*3,0,TAU);ctx.strokeStyle='rgba(143,226,255,.45)';ctx.lineWidth=1.4;ctx.stroke();}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawButtons(){
 $('presets').innerHTML='';
 for(const s of scenes){
   const b=document.createElement('button');b.className='scene'+(s.id===config.scene?' active':'');b.textContent=s.icon+'  '+s.name;b.setAttribute('aria-pressed',String(s.id===config.scene));
   b.onclick=()=>{config.scene=s.id;persist();drawButtons();reset();};$('presets').appendChild(b);
 }
 $('modes').innerHTML='';
 for(const m of modes){
   const b=document.createElement('button');b.className='mode'+(m.id===config.mode?' active':'');b.innerHTML='<span>'+m.icon+'</span>'+m.name;b.setAttribute('aria-pressed',String(m.id===config.mode));
   b.onclick=()=>{config.mode=m.id;persist();drawButtons();};$('modes').appendChild(b);
 }
 counters();
}
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();touched=true;$('hint').classList.add('hidden');
 try{canvas.setPointerCapture(e.pointerId);}catch(err){}
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(config.mode==='blast')burst(e.clientX,e.clientY,130);
},{passive:false});
canvas.addEventListener('pointermove',e=>{if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,e=>touches.delete(e.pointerId));
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('pause').setAttribute('aria-label',paused?'Resume':'Pause');$('state').textContent=paused?'PAUSED':'LIVE SIMULATION';$('live').style.background=paused?'#f9bc65':'#45e6b6';last=0;};
$('burst').onclick=()=>{if(paused)$('pause').click();burst(w/2,h*.41,300);};
$('reset').onclick=reset;
$('shuffle').onclick=()=>{const other=scenes.filter(s=>s.id!==config.scene);config.scene=other[Math.floor(Math.random()*other.length)].id;persist();drawButtons();reset();};
$('settingsButton').onclick=()=>{const open=$('controls').classList.toggle('open');$('settingsButton').textContent=open?'⌃ Hide':'☷ Controls';$('settingsButton').setAttribute('aria-expanded',String(open));};
for(const id of ['density','force','trail','speed']){
 $(id).value=config[id];$(id).oninput=e=>{
   config[id]=Number(e.target.value);
   if(id==='density'){
     const change=config.density-particles.length;
     if(change>0){for(let i=0;i<change;i++)particles.push(newParticle(particles.length));}
     else if(change<0)particles.length=config.density;
   }
   counters();persist();
 };
}
$('auto').checked=config.auto;
$('auto').onchange=e=>{config.auto=e.target.checked;persist();};
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)touches.clear();});
document.addEventListener('contextmenu',e=>e.preventDefault());
createSprites();resize();drawButtons();
requestAnimationFrame(frame);setTimeout(()=>$('hint').classList.add('hidden'),6500);
})();
</script></body></html>
