<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>PC Forge</title><style>:root{font:16px -apple-system,system-ui;background:#080e1d;color:#eef4ff}body{margin:0;padding:env(safe-area-inset-top) 17px 30px}header{padding:20px 0}h1{margin:0;font-size:32px}p,small{color:#aabbd3}.card{background:#142139;border:1px solid #30415d;border-radius:17px;padding:17px;margin:12px 0}select,button{font:inherit;border-radius:10px;padding:13px;color:white;background:#263957;border:1px solid #536583;width:100%}button{background:#45b9c6;color:#041a25;font-weight:800}b{display:block;margin-bottom:10px}.total{font-size:30px;color:#69e2cb;font-weight:900}.warn{color:#ffcf83}.good{color:#74e3ac}a{color:#8bdff3;display:inline-block;margin:7px 10px 7px 0}</style></head><body><header><small>AUSTRALIAN PC BUILDER</small><h1>⚙ PC Forge</h1><p>Choose parts, check basic compatibility and compare stores.</p></header><div class="card"><b>Estimated total</b><div class="total" id="total"></div><small>Indicative prices only, not live quotes</small></div><div id="parts"></div><div class="card"><b>Compatibility</b><div id="compat"></div></div><div class="card"><b>Search Australian retailers</b><select id="partsearch"></select><div id="shops"></div></div><div class="card"><button id="save">Save this build</button><div id="saved"></div></div><script>
const data=[['CPU',[['Ryzen 5 5600',169,'AM4'],['Ryzen 7 7800X3D',549,'AM5'],['Ryzen 7 9700X',479,'AM5'],['Core i5 14600K',429,'LGA1700']]],['Motherboard',[['B550M DS3H',139,'AM4','DDR4'],['X870 Pro-A WiFi',279,'AM5','DDR5'],['B650 Gaming Plus',259,'AM5','DDR5'],['B760M-A',209,'LGA1700','DDR5']]],['RAM',[['32GB DDR4',119,'DDR4'],['32GB DDR5',199,'DDR5'],['32GB RGB DDR5',239,'DDR5']]],['GPU',[['RTX 4060 8GB',449],['RTX 5070 12GB',999],['RX 7800 XT',749]]],['Storage',[['1TB NVMe SSD',109],['2TB NVMe SSD',199],['4TB NVMe SSD',399]]],['Power supply',[['650W Bronze',109],['750W Gold',169],['850W Gold',209]]],['Case',[['ATX airflow',129],['Micro ATX mesh',99]]],['Cooling',[['Air cooler',49],['240mm AIO',139],['360mm AIO',189]]]];const $=x=>document.getElementById(x);let pick=JSON.parse(localStorage.getItem('pcforge-pick')||'{}');const fmt=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n);const part=i=>data[i][1][pick[i]||0];function render(){let sum=0;$('parts').innerHTML='';data.forEach(([name,options],i)=>{const div=document.createElement('div');div.className='card';const b=document.createElement('b');b.textContent=name;const s=document.createElement('select');options.forEach(([title,price],j)=>{const o=document.createElement('option');o.value=j;o.textContent=title+' · '+fmt(price);s.append(o)});s.value=pick[i]||0;s.onchange=()=>{pick[i]=Number(s.value);localStorage.setItem('pcforge-pick',JSON.stringify(pick));render()};div.append(b,s);$('parts').append(div);sum+=part(i)[1]});$('total').textContent=fmt(sum);let warnings=[];if(part(0)[2]!==part(1)[2])warnings.push('CPU socket does not match motherboard');if(part(2)[2]!==part(1)[3])warnings.push('RAM generation does not match motherboard');$('compat').innerHTML=warnings.length?warnings.map(x=>'<p class="warn">⚠ '+x+'</p>').join(''):'<p class="good">✓ CPU socket and RAM generation match</p>';const sel=$('partsearch'),prev=sel.value;sel.innerHTML='';data.forEach(([name],i)=>{const o=document.createElement('option');o.value=i;o.textContent=name+': '+part(i)[0];sel.append(o)});sel.value=prev||0;shops()}function shops(){const q=encodeURIComponent(part(Number($('partsearch').value))[0]);$('shops').innerHTML='';[['Amazon AU','https://www.amazon.com.au/s?k='],['PLE','https://www.ple.com.au/Search/'],['Scorptec','https://www.scorptec.com.au/search?query='],['Umart','https://www.umart.com.au/search?keywords='],['Centre Com','https://www.centrecom.com.au/search?keywords=']].forEach(([n,url])=>{const a=document.createElement('a');a.textContent=n+' ↗';a.href=url+q;a.target='_blank';$('shops').append(a)})}$('partsearch').onchange=shops;$('save').onclick=()=>{let saved=JSON.parse(localStorage.getItem('pcforge-builds')||'[]');saved.unshift({date:new Date().toLocaleString('en-AU'),pick:{...pick}});localStorage.setItem('pcforge-builds',JSON.stringify(saved.slice(0,20)));savedList()};function savedList(){$('saved').innerHTML='';JSON.parse(localStorage.getItem('pcforge-builds')||'[]').forEach((b,i)=>{const button=document.createElement('button');button.style='margin-top:10px;background:#263957;color:white';button.textContent='Load saved build '+(i+1)+' · '+b.date;button.onclick=()=>{pick=b.pick;render()};$('saved').append(button)})}render();savedList();
</script></body></html>
